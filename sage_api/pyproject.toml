[project]
name = "sage-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "aiosqlite>=0.20",
  "pydantic>=2.7",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "anthropic>=0.40",
  "openai>=1.50",
  "httpx>=0.27",
  "asyncssh>=2.14",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "cython>=3.3.2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "setuptools>=84.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
testpaths = ["tests"]
